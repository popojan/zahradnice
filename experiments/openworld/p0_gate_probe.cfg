#!P0 gate probe {steps} {score}
# P0 — gate-mechanics probe for the open-world line (M1-A0).
# A regulatory row sits directly above the tape row; a rule is "gated"
# by requiring a gate glyph at (-1,0) in its LHS. Law mutation =
# rewriting the regulatory row by rules, under a frozen rule table.
#
# Loci after bootstrap (gate row above, tape row below):
#   L1  A gate g      -> t converts to B     (literal ASCII gate ON)
#   L2  A gate empty  -> stays A             (gate absent)
#   L3  A gate <U+0393> -> t converts to D   (literal non-ASCII gate ON)
#   L4  A gate h      -> stays A             (wrong glyph: specificity)
#   L5  P gate empty  -> m writes gate, t->Q, t->R, e erases gate,
#                        further t must NOT fire R->W (gate gone)
#   L6  v gate Γ, L7 v gate g -> t converts to V; L8 v gate h stays
#       (&-gate: allele in header field 6, two headers share one body)
#   L9  w gate g, L10 w gate Γ -> t converts to Z; L11 w gate h stays
#       (%-gate: fires on field-6 OR field-7 allele, one header)
# Rate pair: x carries TWO gated idempotent rules, y carries ONE;
#   r-events must split ~2:1 (weight-proportional global sampling).
#threads 1

^Scc

# bootstrap: atomic render of the whole layout, one-shot on 'b'
==Sb~
@
@
@g Γh ΓghgΓh
 AAAAPvvvwww
 gΓ
 xy

# gated conversions, literal gate glyph in body
==AtB
g
@@@

==AtD
Γ
@@@

# L5 law mutation: matter writes its own gate (RHS above anchor)
==PmP
~ g
@@@

==PtQ
g
@@@

==QtR
g
@@@

# law removal: erase the gate above
==ReR
g ~
@@@

# gated rule that must NOT fire after the erase
==RtW
g
@@@

# &-gate: allele lives in header field 6; one body, one header per allele
==vtV78Γ
==vtV78g
&
@@@

# %-gate: allele disjunction — fires on field-6 OR field-7 glyph
==wtZ78gΓ
%
@@@

# rate pair: two identical gated rules on x, one on y
==xrx
==xrx
g
@@@

==yry
Γ
@@@
