#!P2 interpreter probe {steps}
# P2 — the description rung (registered: ew-design.md §P2).
# Rows: 1 product, 2 heads, 3 code, 4 daughter strand.
# Code strings: S1 ">AbAb" cols 0-4 (marker + description),
# S2 "AAAA" cols 7-10. Codon table: A->A (matter), b->Π (machine).
# Phases (input "b tttt ssss v u xxxxx", contiguous):
#   b  bootstrap: render heads/code/strand rows
#   t  transcription: Π strand-copies S1 to the daughter row
#   s  mutagenic transcription: π strand-copies S2, eps=0.25 flips
#   v  clear the track: erase the parked transcriptase
#   u  place the translator Ω over S1's first codon
#   x  translation: Ω builds the product row per codon table;
#      5th x must no-op (end-of-tape stall)
#threads 1

^Sul

# bootstrap (S at row 1 col 0 erases itself, renders rows 2-4)
==Sb~
@@@
   Π     π
  >AbAb  AAAA
   ????  ????

# translation: read codon below (ctx), construct above (ctxrep)
==Ωx~78AA
==Ωx~78bΠ
   &
@~@@Ω
&

# transcription: read codon below, write daughter below-code
==Πt~78AA
==Πt~78bb
@~@@Π
&
?  &

# mutagenic transcription: same body, mutant headers at 0.25
==πs~78AA
==πs~78bb
==πs~78Ab 0 0.25
==πs~78bA 0 0.25
@~@@π
&
?  &

# clear the parked faithful transcriptase so Ω's track is free
==Πv~
@@@

# place the translator over the first codon (marker > is unique)
==>u
   Ω
@@@
