#!P1 copier probe {steps}
# P1 — copier mechanics probe for the earned family (F4).
# Screen 8x16: row 1 = tape, row 6 = machinery (toroidal (-2,0) from
# tape), row 7 = regulatory ((-1,0) from tape; (+1,0) from machinery).
# Phases by trigger byte (input "bddtttccsssw"):
#   b  bootstrap: one horizontal body renders all three rows
#   d  build: A gated alpha + empty (-2,0) slot writes copier there;
#      second d must no-op (slot full); A over occupied slot and A
#      gated beta never fire
#   t  copy: faithful copier reads template below, requires ? east-
#      below, stamps it, advances east (exclusion); chains; stops at
#      a beta-stamped target (third t no-ops)
#   c  creation: F gated alpha + empty east writes F east + ? above-
#      east (over live beta gate AND over empty gate); the new F
#      (gate ?) cannot create further -- the frontier stall
#   s  sloppy copy: same body as t-copy plus miscopy headers at 0.25
#   w  walk: copier steps east over an already-stamped locus
#threads 1

^Sul

# bootstrap: mach row at (-2,.), reg row at (-1,.), tape at (0,.)
==SbA
   Π    π   Θ
  αα??β α???βααβα
@@@A  A       F F

# build: gated alpha, target machinery slot must be empty
==Ad 78α
~ Π
&
@@@

# faithful copy: template below (ctx), ? east-below, stamp (ctxrep),
# advance east into an empty machinery slot
==Πt~78αα
==Πt~78ββ
@~@@Π
&?  &

# sloppy copy: same mechanics, mutant headers miscopy at weight 0.25
==πs~78αα
==πs~78ββ
==πs~78αβ 0 0.25
==πs~78βα 0 0.25
@~@@π
&?  &

# walk: step east over a stamped locus (alpha or beta), excluding
==Θw~78αβ
@~@@Θ
 %

# creation: gated alpha, east tape cell must be empty; writes matter
# east and de-regulates its gate to ? (over allele and empty alike)
==Fc 78α
&   ?
@~@@F
