# A curated few of experiments/ -- the ones that run unattended and stay
# alive. The rest of the tree is driven by a harness rather than watched:
# bandit/ and garden/ need their parameters fed in on a key, openworld/'s
# probes declare no timing at all, and forest.cfg goes extinct at step
# ~4300 and leaves an empty screen. Every program keeps its own #! so the
# status line still names what its counter means (pop=, grains=, ...).
#
# The anchor must be a character this rule does not itself paint, or it
# re-fires on every copy it just drew.
