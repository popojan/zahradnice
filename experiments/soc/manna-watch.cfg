#! manna-watch  grains={score} steps={steps}  | {help}
# Manna sandpile, arranged to be *watched* rather than measured. A copy of
# manna.cfg (generated by gen_manna.py); regenerating that file does not
# regenerate this one. The toppling and dissipation rules below are verbatim
# but for their colour field -- only the start, the drive and the palette
# differ, and results.md's numbers come from manna.cfg, which is untouched.
#
# Two problems with watching the original:
#  * it fills by driving, so reaching the critical density costs ~0.7*L^2
#    drives -- ~300 at L=16 (measured), ~9000 on a full screen, and at one
#    grain per 1.5 s that is hours before anything interesting happens;
#  * `#timing T 0` relaxes each avalanche at loop speed, so the avalanche --
#    the thing worth seeing -- is a flicker.
#
# Warm start. The field is seeded with 's' and each site resolves to occupied
# or empty at FILL_ON:FILL_OFF = 7:3, the stationary density: the pile begins
# *at* the attractor instead of crawling toward it. No site starts above the
# toppling threshold, so the state is stable and nothing resolves until the
# first grain lands (measured first avalanches: 110, 0, 90, 12, 2, 0 -- ordinary
# sizes, no initial cascade). The occupied branch scores +1, so {score} still
# counts grains. This is only legitimate because the sandpile passed the
# L-scaling test: the attractor does not remember how it was reached.
#
# The fill runs on its own immediate trigger F, so it completes in one event
# per site rather than one per TICK; once no 's' is left those two rules have
# no anchor and F disarms itself.
#
# Self-pacing drive. The drive moved onto T with a negligible weight, so while
# the pile is active toppling outweighs it and it never intrudes -- and the
# moment the pile settles it is the only applicable rule and fires on the next
# tick ("a tiny weight does not make an event rare when it is the only rule
# that matches"). The grain waits for the avalanche at any speed and any field
# size, which no fixed #timing interval can do.
#
# Colour. The glyph already carries the height (0..4, then the owe-states
# u/v/w), and colour cannot carry it too: the engine has one foreground pair
# per rule *application*, while a toppling rule writes two cells -- the site
# and the neighbour it sheds to -- whose heights differ. So colour marks the
# event that last wrote a cell, never its height:
#
#   E  dim blue     an empty site of the warm start
#   G  dim cyan     a grain at rest -- the substrate
#   A  = {TRAIL}    the ejecting half of a toppling (2/3/4 -> u/v/w)
#   D  bright yell  the grain the drive just dropped
#   X  red          a grain shed into the wall and lost (score -1)
#   W  blue         the absorbing wall
#
# Only two of those persist meaningfully: the newest grain, and the red ring
# just inside the frame where the pile loses its mass. Toppling deliberately
# writes the substrate colour, so the field settles back to one calm tone --
# the avalanche is read off the glyphs, which already carry it: 2/3/4 and the
# owe-states u/v/w only exist while a site is active, and they are the only
# non-0/1 glyphs on screen.
#
# TRAIL is the exception, and it is a knob rather than a setting because it is
# a real trade. --param TRAIL=3 paints the ejecting half yellow, which turns
# the field into a cumulative avalanche footprint (~22% of sites at
# stationarity, measured). That is honest -- those sites did each shed a grain
# -- but it is *stale*: a cell keeps the colour of the last rule that wrote it,
# and nothing repaints a quiescent cell. It cannot be made to fade, because a
# repaint rule (1 -> 1) is applicable forever, so its immediate trigger would
# never disarm and the program would spin a core. Yellow at rest therefore
# means "an avalanche passed here", never "active now".
#
# The deeper reason colour cannot simply track height: the engine has one
# foreground/background pair per rule *application*, and a toppling rule writes
# two cells -- the site and the neighbour it sheds to -- whose heights differ.
# So colour marks the event that last wrote a cell. Colour is inert for
# matching, so the derivation is unchanged: the same seed gives the same run.
#
#parameter TRAIL 6,DIM
# Slow motion: TICK ms per applied rule. Raise it to see individual topplings,
# lower it for a livelier pile:  --param TICK=150
#parameter TICK 40
#parameter DRIVE 0.00000001
#parameter FILL_ON 7
#parameter FILL_OFF 3
#threads 1
#timing T {TICK}
#timing F 0
#color E 4,DIM
#color G 6,DIM
#color A {TRAIL}
#color D 3,BOLD
#color X 1
#color W 4
#help sandpile: grains drop, piles topple | q back
#control q return

# field of seed sites framed by absorbing walls (fill marker). The walls are
# seeded as 'b' and repainted as '#' below, because a '^' starting symbol
# paints with the terminal default and cannot carry a colour.
^s**
^bu*
^bl*
^b*l
^b*r

# warm start: each seeded site becomes occupied or empty at the stationary
# density, at F speed. Self-terminating.
==sF1G8   1 {FILL_ON}
@@@
==sF0E8   0 {FILL_OFF}
@@@

# the frame, in its own colour. Self-terminating like the fill above: once
# no 'b' is left this rule has no anchor.
==bF#W8
@@@

# drive: one grain onto a random quiet site. Shares the toppling trigger, so
# it fires only when nothing is toppling.
==0T1D8   1 {DRIVE}
@@@
==1T2D8   1 {DRIVE}
@@@

# carrier for the quit control
=q0q0E8
@@@

