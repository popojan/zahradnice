==.Td60   1 1
@
d
@
@

# lightning on its own trigger: the environment is the INPUT MIX
# (calm = rare 'l' among T's, fiery = frequent). A weight-based knob
# is illusory here: once the field saturates, lightning is the only
# applicable T-rule, so every event strikes regardless of weight -
# in a jump chain, "rare" is only relative to co-applicable mass.
==clA13   0 1
@@@
==dlA13   0 1
@@@

# fire transmission: fast into c (p=0.8), slow into d (p=0.2)
==ATA13   0 4
@c@@A
==ATA13   0 4
c@@A@
==ATA13   0 4
