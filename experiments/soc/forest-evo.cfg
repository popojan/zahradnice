#! forest-evo  pop={score} steps={steps}
#help evolution: watch | l = throw lightning | q quit
# Route-3 POC: selection as rate-learning. Two species with a
# growth/flammability trade-off: c (green) spreads at weight 2 but
# transmits fire at p=0.8; d (cyan) spreads at weight 1 but transmits
# at p=0.2. Same cfg, two environments (lightning weight L, set by the
# harness): if calm worlds select c and fiery worlds select d, the
# ecosystem tunes its mean transmissibility to the environment with no
# optimizer anywhere - the honest minimal form of "feeding reward back
# into the rules" (score is write-only; adaptation must live in state).
#threads 1
#control q quit
#timing l 3000
#timing T 0

^.**
^cXX
^cXX
^cXX
^dXX
^dXX
^dXX

# seed rain: rare spontaneous sprouting on bare ground (symmetric
# immigration; without it, vegetative-only growth is an absorbing trap:
# one supercritical burn of the connected continent = permanent
# extinction - serotiny is what real fire-adapted species use here)
==.Tc20   1 0.02
@@@
==.Td60   1 0.02
@@@

# vegetative growth toward a same-species neighbour
==.Tc20   1 6
@c@@
==.Tc20   1 6
c@@@
==.Tc20   1 6
c
