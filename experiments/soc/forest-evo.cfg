# d pays rent: natural mortality (fire-resistance must cost something,
# or it is dominant under any fire regime - the flip needs a
# mortality asymmetry, competition-colonization style)
==dT.60   0 0.01
@@@

# burnout
==AT.00   -1 1
@@@

# watcher quit carrier
=q.q.
@@@
