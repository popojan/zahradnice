#! forest2  pop={score} steps={steps}
# Drossel-Schwabl forest fire, v2 (v1's vegetative growth densified the
# forest into one percolating cluster -> every strike spanned -> false
# negative from the MAPPING, not the substrate; see results.md).
# The DS correspondence needs site-wise regrowth anywhere, and the
# grammar cannot anchor on emptiness -- so emptiness becomes a symbol:
# ground g fills the field once (self-terminating spread), trees sprout
# from ground uniformly, burnout returns fire to ground. Extinction is
# no longer absorbing (ground always resprouts); the SOC question is
# whether the quasi-steady state shows broad/critical fire sizes with
# no tuned parameter.
# g = ground (dim), c = tree (green), A = fire (red on yellow).
# Score: +1 sprout, -1 burnout => score = live cells (trees+fires).
#threads 1
#timing T 0
#help forest: watch | r reseed | q quit
#control q quit
#control r clear

^gcc

# ground fill (one-shot cascade; inert once no empty neighbours remain)
==gTg00   0 500
@~@@g
==gTg00   0 500
~@@g@
==gTg00   0 500
~
@
@
g
@
==gTg00   0 500
@
~
@
@
g

# growth: any ground cell sprouts a tree
==gTc20   1 100
@@@

# lightning: a tree spontaneously ignites
==cTA13   0 1
@@@

# burn: fire spreads into an adjacent tree
==ATA13   0 5000
@c@@A
==ATA13   0 5000
c@@A@
==ATA13   0 5000
c
@
@
A
@
==ATA13   0 5000
@
c
@
@
A

# burnout: fire returns to ground
==ATg00   -1 5000
@@@

# --- watcher controls (carrier rules fire the engine actions) ---
=qgqg
@@@
=rgrg
@@@
