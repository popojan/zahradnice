#! forest  pop={score} steps={steps}
# Drossel-Schwabl-style forest fire, fully in-grammar (research-rl-ai.md
# S3 route 3, rerouted: rate adaptation via state, not weight mutation).
# c = tree (green), A = fire (red on yellow). Timescale separation by
# weight ratio: burn >> burnout >> growth >> lightning.
# Score: +1 per grown tree, -1 per burnt-out cell => score = live cells
# (trees+fires). All-empty is absorbing: total burnout = death; the SOC
# question is whether the system self-holds between megafire and
# extinction with no tuned parameter.
#threads 1
#timing T 0

