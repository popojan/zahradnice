#! contact process  score={score} steps={steps}  | {help}
#help infection spreads or dies out; all-empty is absorbing | q back
#control q return
# 2D contact process on the toroidal screen — minimal convergence/phase-
# transition probe (backlog/research/research-rl-ai.md §2.1/§2.2).
#
# A = infected, empty = healthy. Rules anchor on A only, so the all-empty
# state is absorbing: once no A remains, no rule is applicable and the
# run is quiescent (stderr event count = extinction step).
#
# Score doubles as a population counter: +1 per infection, -1 per
# recovery => score == current population - initial population.
#
# Per-(site,neighbour) infection weight WI vs per-site recovery weight WR
# gives the control parameter lambda = WI/WR. This file carries near-
# critical defaults for watching a live run (T is the only trigger, so
# `./zahradnice experiments/convergence/contact.cfg --seed 7` is a
# time-lapse: watch the epidemic spread or collapse, population in the
# status score); experiments/convergence/sweep.sh regenerates it across
# the (WI, WR) grid.
#threads 1
#timing T 0

# Clear first: program switching is compositional, so without this the
# seeded A lands in the middle of the caller menu and is walled in by
# its text -- no empty neighbour, so only the death rule applies.
^
^Acc

# recovery: A -> empty
==AT~78   -1 8
@@@

# infection: A spreads into an empty neighbour (4-neighbourhood)
==ATA78   1 4
@~@@A
==ATA78   1 4
~@@A@
==ATA78   1 4
~
@
@
A
@
==ATA78   1 4
@
~
@
@
A

# q returns to the caller. Anchored on a character measured to be on
# screen at every sampled step of a long run -- a head-state anchor
# would make the key work only sometimes.
=qAqA
 @@@

# ... and once the process dies out there is no A left to anchor on, so the
# key would be dead exactly when you most want it. A cell erased with `~` is
# still in the x map (as a space), so anchoring on a space covers the
# absorbing state -- and every state after the first death.
=q q~
 @@@
