#! sir  burned={score} steps={steps}
# SIR outbreak = fire on a full tree field, no regrowth: paper #1's
# second process, from a different universality class (isotropic
# percolation) than the contact process (directed percolation).
# Transmissibility per neighbour p = wb/(wb+wo); fractional weights
# let p be written directly: wb = p, wo = 1-p. All-quiet is absorbing,
# so stderr events = outbreak duration and score = outbreak size
# (burned trees). Sweep p across the bond-percolation region (~0.5),
# N=1 vs N=8, via sweep-sir.sh.
#threads 1
#timing T 0

^c**
^Acc

# burn: fire spreads into an adjacent tree
==ATA13   1 0.5
@c@@A
==ATA13   1 0.5
c@@A@
==ATA13   1 0.5
c
