#! life-steer {score} {steps} {parallel} {help}
#help wasd move | e toggle -1 | r reseed | q quit
#grid 4 2
#timing h 1000
#timing T 0
#control q quit
#control r clear

# Conway steering (research-rl-ai.md §3 Level 0): reuses life.cfg
# unchanged via #include; adds a movable cursor bracketing one 4x2 cell
# block: two > on its left edge column, two < on its right edge column.
#
# The brackets sit on the block's phase columns (c0/c3), which pins the
# hovered cell (its own rules anchor there) while its digit column stays
# visible, so neighbours keep counting it. Because a bracketed block is
# never empty inside, the dead-block materialization rule (which matches
# only two empty probe cells but writes a full 8-cell block) cannot fire
# into it -- overlay glyphs anywhere else get bulldozed, as a --trace-cell
# session showed. Movement does not restore from memory: it normalizes
# the vacated block to base phase (b/./b), preserving the digits, which
# also cleanly restarts any scan it interrupted. A ! probe (ctx ~) stops
# the cursor from entering still-virgin screen where the materializer
# could overwrite it.
#
# Scores: birth +1 / death -1 come from life.cfg; each toggle costs -1
# in both directions (the kill cost matches the physics death penalty,
# so mercy-killing dying cells can never be farmed for score).
#
# Observer tax: hovering is itself an intervention (the brackets pin the
# cell), and a lookahead baseline exploited it for free. Pricing is
# rate-based, not per-keypress: the slow `h` timing fires a -1 rule only
# while the cursor pins a LIVE cell (parking on dead ground is free).
# At long horizons only reward *rates* matter, so the tax rate is tuned
# by trigger cadence (interval here, injection frequency headless) --
# no fractional scores needed. Alternatives, documented for the record:
# per-move stochastic pricing via weighted duplicate headers (score 0
# weight 4 + score -1 weight 1 over one body = expected -0.2 per move,
# nondeterministic rewards), or scaling all rewards x5 if reward
# determinism is required.

