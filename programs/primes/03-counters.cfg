# Sieve of Eratosthenes with positional counters: one row per divisor.
# Generated by tools/gen_primes3.py -- edit there (BASE=10, NDIG=3).
#
# Row 2 is an odometer counting up in base 10; every row below it holds
#     [ dd - kk      divisor, and columns left until its next multiple
# riding just left of the scan column.  Per number the record shifts one
# column right and kk decrements; kk = 0 means "multiple", and the row
# reloads kk from dd.  The scan wraps, so numbers are not tied to columns.
#
#   > <  scan head (< = multiple seen)   } {  odometer: carry / copy
#   ) (  record shift: clean / hit       ? ,  reload: borrow / copy
#   ; :  allocator: seek / push          / \  build counter / divisor half
#   |    return with no room             "  [  -  _   sentinels
#
# No rule mentions a divisor. What the rules DO know is the digit table
# for base 10 -- that is what positional notation costs over primes2.
#help Counters: a divisor is a numeral, records slide   space=pause  c=restart  q=quit
#timing T 0
#transient ;|
#control Z pause
#control C clear
#control Q return
#color G 2,BOLD
#color N 6
#color D 4

