# Real-time prime generator: a genuine 1-D cellular automaton.
# Generated by tools/gen_primes5.py -- edit there.
#
# P. C. Fischer, "Generation of Primes by a One-Dimensional
# Real-Time Iterative Array", JACM 12(3) (1965) 388-394.
#
# Rows are cells, columns are time.  No signal moves faster than one
# cell per column -- unlike primes2, whose allocation ray runs
# backwards in time -- so the verdict for n really does stand in
# column 3n.  Row 1 is M_0: "#" prime, "," composite.
#
#   a  speed 1     builds the partition into blocks
#   b  speed 1/3   carries "n has a divisor" back to M_0
#   c  speed 1/2 right, 1 left   oscillates in one block, period 3k
#
# Cell k(k+1)/2 turns into a mirror at time (3k^2+k)/2-1; the block
# it closes has length k and crosses out k^2, k^2+k, k^2+2k, ...
# Nothing in the rule set mentions a divisor: a block length is
# matter, exactly as in primes2.
#
# Every row carries its own head, so rows advance independently and
# the wavefront is ragged; a head cannot fire until its three left
# neighbours are final, which is the whole synchronisation.  Depth is
# 2 rewrites per column whatever the height, so there is real work
# to hand to every core; the engine takes them all by default and
# the screen comes out the same either way.
#
# glyphs:
#   o   0:S0
#   O   0:S1
#   0   0:S2
#   +   0:S3
#   -   0:VC
#   #   0:VP
#   '   0:p1
#   `   0:p2
#   .   N:
#   /   N:aL
#   \   N:aR
#   "   N:aR,bR1
#   1   N:bL1
#   (   N:bL1,cL
#   )   N:bL1,cR1
#   ,   N:bL1,cR2
#   2   N:bL2
#   4   N:bL2,cL
#   5   N:bL2,cR1
#   6   N:bL2,cR2
#   3   N:bL3
#   :   N:bL3,cL
#   ;   N:bL3,cR1
#   <   N:bL3,cR2
#   9   N:bR1
#   8   N:bR2
#   7   N:bR3
#   ^   N:cL
#   V   N:cR1
#   v   N:cR2
#   =   P:
#   >   P:aL,bR1
#   ?   P:aL2,bR2
#   X   P:aR
#   B   P:aR,bL3,cR2
#   G   P:bL1
#   C   P:bL1,cL
#   F   P:bL2
#   D   P:bL2,cL
#   I   P:bL2,cL,cR1
#   J   P:bL2,cR1
#   E   P:bL3
#   K   P:bL3,cL
#   L   P:bL3,cL,cR2
#   M   P:bL3,cR2
#   A   P:cL
#   _   _
#
#help Fischer 1965: real time, three columns per number   space=pause  c=restart  q=quit
#timing T 0
#control Z pause
#control C clear
#control Q return
#color G 2,BOLD
#color M 5,BOLD
#color D 7,DIM

# --- seeds: column 0 is the configuration at t = 0 ---
^
^Q*l
^_l*
^oul

# --- launch one head per row into column 1 ---
# Anchored on the seeded origin column, so it fires exactly once per
# row: an interior cell always has a non-empty left neighbour.
==QTQD8
 ~@~@@H

==oToD8
 ~@~@@h

