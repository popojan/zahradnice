#! Steps: {steps} ({parallel}) Moves: {moves} Score: {score} | {help}
# The template must be the very first line (grammar.cpp gates on it).
# A menu carries it so returning RESETS the status line: a program with
# its own #! sets it globally and nothing puts it back, so a demo's
# "pop=" caption would otherwise survive into everything opened later.
#help Prime machines  w/s choose  e run  q back
#timing T 0
#program 1 01-eratosthenes.cfg
#program 2 02-bands.cfg
#program 3 03-counters.cfg
#program 4 04-packed.cfg
#program 5 05-fischer.cfg
#program 6 06-umeo.cfg
#sound D sounds/clack.wav
#control Q return

^
^1cc?

# --- selection ---
# `^1cc?` above: the caller hands back the #program key of the entry it is
# returning from, and it lands here; `1` stands in on first entry. Each
# rule below turns one key into the frame anchor Z (so the frame paints
# once, generically) plus the cursor in that key's row. The `~` either
# side of the key is what keeps a rule off the digits in "1965".
# Eratosthenes
==1TZ
             ~@~
              @
x



              @

# Bands
==2TZ
             ~@~
              @
x


              @

# Counters
==3TZ
             ~@~
              @
x

              @

# Packed
==4TZ
             ~@~
              @
x
              @

# Fischer
==5TZ
             ~@~
              @
x             @

# Umeo
==6TZ
             ~@~
              @
              @
x

# The anchor must be a character this rule does not itself paint,
# or it re-fires on its own output: `P` re-drew the menu from every
# P in "P R I M E S" and "Packed".
# Six ways to sieve. Each one moves the divisor further out of the rule set
# and, from Fischer on, makes the picture a lawful cellular automaton.
==ZT5
   P R I M E S .

  | |~Eratosthenes~
  | |~Bands~
  | |~Counters~
  | |~Packed~
@@| |~Fischer~196@~
  | |~Umeo~2015~
  | |~
  | |~Back

=Dxs~
 @ @@
| | x
=Dxw~
| | x
 @ @@

=1xex
@| Eratosthenes@@
=2xex
@| Bands@@
=3xex
@| Counters@@
=4xex
@| Packed@@
=5xex
@| Fischer@@
=6xex
@| Umeo@@
