#!Eratosthenes   primes: {score}   {help}
# Sieve of Eratosthenes.  Generated by tools/gen_primes.py -- edit there.
#
# The magnitude of a number is its screen COLUMN.  Row 1 is the number
# line, row d is the comb of divisor d, and the bottom rows label every
# column with its own value in base 10, written vertically.
#
#   >  scan cursor, verdict open        o  dormant divisor d, at (d,d)
#   x  scan cursor, verdict composite   +  head of an activated comb
#   W  comb walker, parked on the       -  a struck-out multiple
#      next multiple of its divisor     #  prime      .  composite
#   A  odometer head, carrying          _  column is labelled
#   B  odometer head, copying           |  right-edge stop
#
# A comb is only built for a divisor the sieve has already found prime,
# so rows 4, 6, 8, 9, 10, 12 stay empty -- that is Eratosthenes, not
# trial division.  Divisors run to 13, so verdicts are exact while the
# smallest untested prime factor cannot occur, i.e. for n < 289.
#help  space=pause  c=restart  q=quit
#timing T 10
#threads 1
#control Z pause
#control C clear
#control Q quit
#color G 2,BOLD
#color K 0,BOLD

# --- seeds (must precede every rule: GRAMMAR-pitfalls #19) ---
^
^|ur
^Sul

