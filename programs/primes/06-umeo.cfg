# Real-time prime generator in eight states -- one column per number.
# Generated by tools/gen_primes6.py -- edit there.
#
# H. Umeo, K. Miyamoto, Y. Abe, "Real-Time Prime Generators
# Implemented on Small-State Cellular Automata", in Automata,
# Universality, Computation, ECC vol. 12, Springer 2015, 341-352.
# The rule set is their Fig. 15.7; this file is that table.
#
# Rows are cells, columns are time.  Row 1 is C_1 and its state IS
# the answer: "1" when the column number is prime, "0" when it is
# not.  Unlike primes5 there is no time dilation and no separate
# alphabet for the number line -- eight states do everything.
#
# A mark stands on cell i*i; the partition between i*i and (i+1)^2
# reciprocates with period 2k for k = 2i+1, and crosses out every
# 2k-th number from k^2 on.  Odd k only: the even multiples were
# already struck by 2.  No divisor appears anywhere in the rules.
#
# states:
#   .  quiescent      0 1  a verdict at C_1 / working states
#   V  R  L  r  /     signals building and running the partitions
#   _  wall: the array is truncated here
#
#help Umeo 2015: real time, eight states, one column each   space=pause  c=restart  q=quit
#timing T 0
#control Z pause
#control C clear
#control Q return
#color G 2,BOLD
#color M 5,BOLD
#color D 7,DIM

# --- seeds: column 0 is the configuration at t = 0 ---
^
^Q*l
^_l*
^qul

# --- launch one head per row into column 1 ---
# Anchored on the seeded origin column, so it fires once per row: an
# interior cell always has a non-empty left neighbour.
==QTQD8
 ~@~@@H

==qTqD8
 ~@~@@h

# --- the array: one rule per (above, self, below) --------------
# This block IS Fig. 15.7, plus the combinations only a truncated
# array can reach, which resolve to a dead signal.  `_` repeats the
# `.` case: past the wall the array is quiescent.
