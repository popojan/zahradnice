# Sieve of Eratosthenes with no divisor in the rule set.
# Generated by tools/gen_primes2.py -- edit there.
#
# A divisor is a band of rows between two mirror lines, with one token
# bouncing inside it.  Separation p+1 makes the token land on a mirror
# every p columns, so the band HEIGHT is the divisor -- matter, not rule
# geometry.  Enlarge the terminal and the sieve gains divisors by itself.
#
#   H K  scan head (K = hit seen)     v ^  token, falling / rising
#   D F  head about to drop a token   =    mirror        :  left margin
#   P Q  allocation probe             #    prime         .  composite
#   R    45-degree measuring ray      L    mirror-line drawer
#
# Column c is derived from column c-1 alone: the head is a 1-D cellular
# automaton over the rows, stepped once per number.
#help Bands: a divisor is a band of rows, unary   space=pause  c=restart  q=quit
#timing T 3
#transient Q
#control Z pause
#control C clear
#control Q return
#color G 2,BOLD
#color M 4,BOLD

# --- seeds (must precede every rule: GRAMMAR-pitfalls #19) ---
^
^=l*
^:*l
^|*r
^Sul

# --- setup: seed column 1 and launch the first head at column 2 ---
==ST.48
 @@@.
     H

# --- scan head H ---
==HT=M8
 =@@@
    H

==HT=M8
 L@@@
    H

==HT~78
 ~@@@
    H

==HT^G8
 v@@@
 =  K

==HT~78
 v@@@
 ~  D

==HTvG8
 =
 ^@@@
    K

==HT~78
 ~  ^
 ^@@@
    H

==HT~78#.
 %
 ^@@@
    H

# --- scan head K ---
==KT=M8
 =@@@
    K

==KT=M8
 L@@@
    K

==KT~78
 ~@@@
    K

==KT^G8
 v@@@
 =  K

==KT~78
 v@@@
 ~  F

==KTvG8
 =
 ^@@@
    K

==KT~78
 ~  ^
 ^@@@
    K

==KT~78#.
 %
 ^@@@
    K

==DTv68
 @@@
   H

==FTv68
 @@@
   K

# --- verdict at row 1 (the head has wrapped) ---
# composite: advance. The (0,1) guard halts the scan at the right edge.
==KT.48#.
 %@~@@
      H

# prime: advance, and allocate a band iff row 2 of this column is free
==HT#G8#. 1 1
 %@~@@
  ~  P

==HT#G8#. 1 1
 %@~@@
  =   H

==HT#G8#. 1 1
 %@~@@
  v   H

==HT#G8#. 1 1
 %@~@@
  ^   H

# --- probe: walk down this column to the topmost mirror ---
# It may meet a rising orphan (a prime whose band did not fit); walking
# over one is harmless -- it belongs to no band and marks nothing.
==PT~78
 @@@
 ~ P

==PT~78
 @@@
 v P

==PT~78
 @@@
 ^ P

==PT^68
 ~ R
 @@ @
 =  Q

# no room above for the ray: skip the allocation, just return
==PT~78#.
 %
 @@@
 = Q

# --- return: fall through the bands (restoring them) and wrap to row 1,
# which is what releases the next scan head. Serialised on purpose:
# the token must be in place before the next column is derived.
==QT$78
 @@@
 ~ Q

==QT$78
 @@@
 = Q

==QT$78
 @@@
 v Q

==QT$78
 @@@
 ^ Q

==QT$78#.
 @ @@
 %~
     H

# --- the measuring ray: up-left at 45 degrees to the margin ---
# It entered at column c, so it lands exactly c rows higher.
==RT~78
 ~  R
  @@ @

==RT~78
 v  R
  @@ @

==RT~78
 ^  R
  @@ @

==RT~78
 :  L
  @@ @

# ray ran into the number line: the field is full, no band is built
==RT~78#.
 %
  @@@

# --- draw the new mirror rightwards to the edge ---
==LT=M8
 @~@@L

==LT=M8
 @=@@L

==LT=M8
 @v@@L

==LT=M8
 @^@@L

==LT=M8
 @|@@

# --- controls (engine actions need a rule to fire them: #17) ---
# A head is only ever in ONE of its many states, so anchoring a control
# solely on head glyphs makes the key work only sometimes. Anchor it on
# the seeded scenery too -- that is always on screen.
=ZH~ 78
=ZK~ 78
=Z:~ 78
=CHc 78
=CKc 78
=C:c 78
=QHq 78
=QKq 78
=Q:q 78
 @@@
