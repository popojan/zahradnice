# Packed static counter sieve. Generated by tools/gen_primes4.py
# (BASE=10, NDIG=4, slot pitch 10) -- edit there.
#
# row 1  H nnn f ppp   candidate, verdict, last prime found
# row 3+ slot 0 is a row header, then records:  [ ddd : kkk
#        ddd = divisor, kkk = candidates left until its next multiple
#
# One head walks slot to slot; a record costs ONE rule application,
# because a static counter lets the whole borrow chain be a single rule.
# kkk = 0 means "multiple": the row reloads kkk := ddd-1 and the pass is
# marked composite. Arriving home prints the verdict and, on a prime,
# pushes every record one slot along so the new one lands at a fixed spot.
#
#   > <  walking a row (< = multiple seen)   { }  descending a row
#   ? ,  reload: borrow / copy               A )  candidate + 1
#   "    copy candidate to last-prime field  Y    lay out row headers
#   ; '  find the free slot                  _ |  push records one slot
#   ] ^ `  write the new record: divisor half / counter half
#help Packed: records stand still, a head visits them   space=pause  c=restart  q=quit
#timing T 0
#grid 10 1
#transient ><{};(
#control Z pause
#control C clear
#control Q return
#color G 2,BOLD
#color N 6
#color D 4

