#! Steps: {steps} ({parallel}) Moves: {moves} Score: {score} | {help}
# The template must be the very first line (grammar.cpp gates on it).
# A menu carries it so returning RESETS the status line: a program with
# its own #! sets it globally and nothing puts it back, so a demo's
# "pop=" caption would otherwise survive into everything opened later.
#help Menu  w/s choose  e run  q quit
#timing B 500
#timing T 0

^
^2cc?
#sound D sounds/clack.wav

#program 2 flowers.cfg
#program 3 highnoon.cfg
#program 4 sokoban
#program 5 tetris
#program 7 life-setup.cfg
#program 9 snake
#program 0 zen.cfg
#program A maze.cfg
#program H hex
#program P ../experiments
#program S primes
#control Q quit

# --- selection ---
# `^2cc?` above is the caller's: on a return the engine plants the #program
# key of the entry we came back from, and `2` stands in on first entry.
# Each rule turns one key into the frame anchor Q — so the frame paints
# once, generically — plus the cursor in that key's row. The `~` either
# side of the key pins it as standing alone, so a rule cannot fire on a
# stray copy of its own key inside the painted frame.
