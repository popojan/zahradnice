#! Ants  home={score}  {help}
# ----------------------------------------------------------------------
# Ant colony foraging.  GENERATED by tools/gen_ants.py -- edit that.
#
# ↑→↓←  ant, searching         ●  food crumb
# ⇑⇒⇓⇐  ant, carrying a crumb  ▒  nest
# ╹╺╻╸  fresh pheromone        ╵╶╷╴  evaporating
#
# A stub always points the way home.  Laden ants walk downstream along
# it, searching ants walk upstream, so one field does the work of
# NetLogo's two scent gradients.  Traffic writes heavy stubs, time
# fades them: the near pile builds a highway, and when it is eaten the
# highway evaporates and the colony re-aims at the next pile.
# ----------------------------------------------------------------------

# Tunables.  A #parameter value runs to the end of its line, so the
# commentary has to sit above rather than beside it.  Override any of
# them per run: ./zahradnice programs/ants.cfg --param P_FADE=0.05
#
# ms between rule applications -- the whole simulation runs on one clock
#parameter TICK 8
# a step onto bare ground: straight on, then to either side.  Their
# ratio is how ballistic the search is; equal weights make it diffusive.
#parameter W_F_BLANK 3
#parameter W_S_BLANK 1
# a step along a trail the useful way.  W_S_GOOD > W_F_BLANK is what
# makes an ant turn onto a trail it merely brushes past.
#parameter W_F_GOOD 18
#parameter W_S_GOOD 6
# ... and the useless way: home without a crumb, or away with one.
#parameter W_F_BAD 1.2
#parameter W_S_BAD 0.4
# ... and straight across someone else's trail.
#parameter W_F_CROSS 3.6
#parameter W_S_CROSS 1.2
# turn on the spot: the wiggle, and the only way out of a dead end
#parameter W_TURN 0.3
# pick up / drop off, high enough to beat any step out of the way
#parameter W_PICK 40
#parameter W_DROP 40
# evaporation, fresh -> faded -> gone.  Raise it and trails die before
# a round trip finishes; lower it and the web fills the screen.  Between
# about 0.04 and 0.15 the crumb rate barely moves, so these two are set
# for the picture rather than the throughput: enough fresh trail to read
# as a highway, enough faded trail to read as a memory of one.
#parameter P_FADE 0.15
#parameter P_GONE 0.3

#timing T {TICK}
#threads 1
#help SPACE pause   x restart   q quit

# Colours.  A move rule paints the ant and the stub it leaves in one
# colour, so the two are deliberately the same thing: a trail segment is
# tinted by whoever last walked it.  Cyan A = searching, green B = laden
# and food, blue F = evaporating, yellow N = nest.  No trailing comments
# here either -- `#color B 2,BOLD  # laden` compares the attribute as
# "BOLD  # laden" and silently drops the bold.
#color A 6
#color B 2,BOLD
#color F 4
#color N 3

#sound c sounds/click.wav
#control R return
#control C clear
#control P pause

^
^Zcc

# Set the table.  Scenery first and ants last, because the ants start
# walking the moment they are on screen: painted before the nest was,
# the ones that had wandered onto a nest cell were painted over and the
# colony opened two ants short.  The weight keeps the four stages ahead
# of the ants they create.
==ZTYN0   0 10000
      @
      @
    ▒▒▒▒▒
  ▒▒▒▒▒▒▒▒▒
 ▒▒▒▒▒@▒▒▒▒▒
  ▒▒▒▒▒▒▒▒▒
    ▒▒▒▒▒

==YTXB0   0 10000
                          @
                          @
                                  ●●●
                                 ●●●●●
                                 ●●●●●
                                 ●●●●●                    ●●●
                                  ●●●                    ●●●●●
                                                         ●●●●●
                                                         ●●●●●
                          @                               ●●●





  ●●●
 ●●●●●
 ●●●●●
 ●●●●●
  ●●●

==XTWA0   0 10000
       @
       @
     ↑ ↑ ↑

  ←
 ←     @     →
            →

     ↓ ↓ ↓

# ... and the anchor cell, held out of the mound until the end, becomes
# the last brick of it.
==WT▒N0   0 10000
 @@@

# Keys.  Anchored on the nest, the one thing never eaten or moved.
=R▒q▒N0
=C▒x▒N0
=P▒~▒N0
 @@@

# Evaporation.  These compete with the ants for the same steps, which
# is what keeps the trail field from growing without bound: it settles
# where deposition and decay balance.
==╹T╵F0   0 {P_FADE}
 @@@

==╵T~F0   0 {P_GONE}
 @@@

==╺T╶F0   0 {P_FADE}
