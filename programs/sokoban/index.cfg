# level architecture
# --- selection ---
# `^Occ??` above is the caller's: on a return the engine plants the #program
# key of the entry we came back from, and `O` stands in on first entry.
# Each rule turns one key into the frame anchor 1 — so the frame paints
# once, generically — plus the cursor in that key's row. The `~` either
# side of the key pins it as standing alone, so a rule cannot fire on a
# stray copy of its own key inside the painted frame.
