# Enemy autonomous movement: deferred.
# Horizontal enemy bodies cannot check the destination in LHS (it falls in the RHS
# column range), so there is no way to exclude the player's O cell from reachable
# destinations. Enemies landing on O remove it from x-map, making movement impossible
# with no game-over. Movement will be reinstated once a safe blocking check exists.
