# Biome: Plains
# Seeding: OTO rules plant o on unrevealed (~) neighbours.
# Evolution: o evolves on T timing to biome content.
#   - 50% empty (erased)
#   - 14% grass (g + , = passable)
#   - 14% tree  (^ X | = blocking, X is the marker checked by movement rules)
#   - 7%  water (:w: = passable)
#   - 7%  rock  ((X) = blocking)
#   - 7%  enemy (e = passable by player, moves autonomously)
# Blocking marker X: movement rules use !X to prevent entering tree/rock tiles.

#color G 2,BOLD
#color D 7,DIM
#color E 1,BOLD
#color f 0,DIM

# Seed NW (-2,-7): LHS & at body(2,2), RHS & at body(2,18)
==OTO~~~o


  &               &

         @       @       @
# Seed N (-4,0): LHS & at body(0,9), RHS & at body(0,25)
==OTO~~~o
         &               &



         @       @       @
# Seed NE (-2,+7): LHS & at body(2,16), RHS & at body(2,32)
==OTO~~~o


                &               &

         @       @       @
# Seed SE (+2,+7): LHS & at body(6,16), RHS & at body(6,32)
==OTO~~~o


         @       @       @

                &               &
# Seed S (+4,0): LHS & at body(8,9), RHS & at body(8,25)
==OTO~~~o


         @       @       @



         &               &
# Seed SW (+2,-7): LHS & at body(6,2), RHS & at body(6,18)
==OTO~~~o


         @       @       @

  &               &

# Seed evolution
# Empty — place invisible floor marker f (dim-black = invisible on dark terminals).
# f is not fog/space so the reveal animation won't overwrite it with `.`,
# and ==.To (removed from hex.cfg) won't re-seed it. Tile stays permanently empty.
==oTff8   0 7
@@@

# Grass — g plus , blade (bold green, passable) (14%)
==oTgG8   0 2
@@@,

# Tree — ^ canopy above, X blocker at centre, | branch right (bold green, blocking) (14%)
==oTXG8   0 2
   ^
@@ @|

# Water — :w: ripples (cyan, passable) (7%)
==oTw68   0 1
@@:@:

# Rock — (X) boulder (dim white, blocking) (7%)
==oTXD8   0 1
@@(@)

# Enemy — e (bold red, passable by player, moves on B timing) (7%)
==oTeE8   0 1
@@@
