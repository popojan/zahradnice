#!inverse: evolution   steps={steps}   [p]=wound   ESC=exit
# Night-5 experiment (experiments/inverse/night5-results.md) live:
# a SLOW green lineage (mover weight 0.5) starts alone. Its trail is
# its genome, and the genome mutates: rare copying errors flip green
# trail to cyan (and back). A mutant trail cell is invisible fitness
# until a wound lands beside it — then it respawns a CYAN head whose
# mover runs at full weight 1. Watch: cyan specks appear in the green
# trail (stored variation), a wound eventually expresses one, and the
# faster lineage sweeps the ring. Afterwards green flickers keep
# being born from back-mutation and eaten again — mutation-selection
# balance. Without wounds nothing ever evolves: damage is the
# expression mechanism. Press p to speed history up.
#help green=slow resident; cyan=fast mutant; p=wound (wounds express mutants)
#threads 1
#timing T 40
#timing p 700
^Acc
