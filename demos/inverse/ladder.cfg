#!inverse: stroke ladder   steps={steps}   [p]=wound   ESC=exit
# Night-6 experiment (experiments/inverse/night6-results.md) live:
# three walking ENGINES, all rule weights equal — they differ only in
# STRUCTURE, i.e. how many events one cell of progress costs:
#   green  3-stroke  E->H->I->step   (slowest)
#   yellow 2-stroke  C->G->step
#   red    1-stroke  A->step         (fastest)
# The trail is the genome (b/d/f-style: here B/D/F), the handler is
# the genome->mechanism map (trail + wound -> that engine's head),
# and mutation flips trail glyphs. Start: the green 3-stroke alone.
# Watch evolution climb the ladder — often skipping yellow entirely
# (leapfrog). Time itself is the fitness function: no weights, just
# strokes. Mash p hard enough and you enter the rescue/collapse
# regime from the night-6 data.
#help green 3-stroke evolves toward red 1-stroke; p=wound; weights all equal
#threads 1
#timing T 40
#timing p 500
^Ecc
# movers (one per engine; the ONLY difference is strokes, not weight)
==ATB18
@@@A
==GTD38
@@@C
==ITF28
@@@E
# wind-up strokes (structural cost: these events buy no distance)
==CTG38
==ETH28
==HTI28
@@@
# handlers: the genome->mechanism map (trail + wound -> ready head)
==BTA18
==DTC38
==FTE28
@~@@
# mutation: trail copying errors among the three genomes
==BTD38   0 0.003
==BTF28   0 0.003
==DTB18   0 0.003
==DTF28   0 0.003
==FTB18   0 0.003
==FTD38   0 0.003
@@@
# wounds erase one random cell of matter, any glyph
==Ap~
==Bp~
==Cp~
==Dp~
==Ep~
==Fp~
==Gp~
==Hp~
==Ip~
@@@
