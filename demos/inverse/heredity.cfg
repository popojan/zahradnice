# Night-4 experiment (experiments/inverse/night4-results.md) as a
# watchable ecology: two lineages, green (A/a) and cyan (C/c), share
# one ring and one mechanism. The trail IS the genome: wounds respawn
# heads from the local trail, so colours breed true. Heads overwrite
# foreign matter — territory war. A lineage can go dormant (head
# dead, trail alive) and be resurrected by a later wound (seed-bank);
# when its last trail cell is overwritten it is extinct for good.
# Neutral weights: pure drift — watch one colour eventually win.
