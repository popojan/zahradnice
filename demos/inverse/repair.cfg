#!inverse: self-repair   steps={steps}   [p]=wound (mash to kill)   ESC=exit
# Night-2 archetype (experiments/inverse/night2-results.md): the
# minimal self-repairing moving structure. A green head A walks east
# leaving trail a; a trail cell that sees empty east — possible only
# where a wound struck — respawns a head (shown red). Wounds arrive
# ambiently every ~1.5s; press p to wound by hand. Each wound can
# spawn an extra head (damage breeds walkers — night 3); heads merge
# on collision. Mash p fast enough (damage > ~1/3 of events) and the
# organism collapses — the night-3 budget-share threshold, live.
#help p=wound: it heals (red). Gentle=repair, medium=multiply, mash=kill
#threads 1
#timing T 60
#timing p 1500
^Acc
# mover: head steps east, painting trail behind
==ATa28
@@@A
# handler: trail beside a hole respawns a head (red scar)
==aTA18
@~@@
# harness: p erases one random cell of matter
==Ap~
@@@
==ap~
@@@
