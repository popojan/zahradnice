#!inverse: tape commons   steps={steps}   [p]=wound   ESC=exit
# Night-7 experiment (experiments/inverse/night7-results.md) live:
# the ring is a circular chromosome of genes — green f (fast to
# traverse) and red s (slow: the polymerase must settle, an extra
# event) — patrolled by eternal polymerase heads (F/S/W). Wounds
# erase genes; the ONLY replication in this universe is repair: a
# head beside a hole writes a copy of the gene it covers. No
# mutation rules, no weights, nine rules total. f is a public good
# (speeds every head); s slows the commons. Watch gaps open, repair
# convoys, and the composition drift. Mash p to collapse the
# commons — at heavy damage the tape dies back to what the
# machinery shelters, and the heads are mostly standing on red.
#help green f fast / red s slow genes; heads copy what they cover into wounds; p=wound
