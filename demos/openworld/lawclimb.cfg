#!open world: mutation climbs   steps={steps}   [p]/[q]=wound   ESC=exit
# OW-3 live (experiments/openworld/ow3-results.md). The world
# starts as a cyan monoculture: every locus under γ, the
# lottery walker — a law that spreads but cannot heal, doomed
# under ambient wounds. But copying law is imperfect: with a
# small weight, a firing locus stamps a DIFFERENT law onto
# the cell it expands into (magenta flash = fresh mutant).
# Reachable laws: red α (blind spawner — the k=1 repairer the
# night-2 census crowned), green β (mover+handler repairer),
# yellow δ (inert self-loop: a dead end that just erodes),
# and γ itself. Watch the cyan world stumble onto red and get
# swept — mutation-selection climbing to the censused peak in
# real time. Sometimes the world dies before it finds red:
# discovery is not rescue.
#help cyan=doomed start, magenta=mutation, red=the peak | p/q=wound
#threads 1
#timing T 50
#timing p 1100
#timing q 1900
^Au*
^γl*
==ATA18αα
==ATA58αβ 0 0.02
==ATA58αγ 0 0.02
==ATA58αδ 0 0.02
&  &
@@@A
==ATB28ββ
==ATB58βα 0 0.02
==ATB58βγ 0 0.02
==ATB58βδ 0 0.02
&  &
@@@A
==BTA28ββ
&
@~@@
==ATB68γγ
==ATB58γα 0 0.02
==ATB58γβ 0 0.02
==ATB58γδ 0 0.02
&  &
@@@A
==ATA38δδ
&
@@@
==Ap~
@@@
==Bp~
@@@
==αq~
@@@
==βq~
@@@
==γq~
@@@
==δq~
@@@
