#!open world: primordial soup   steps={steps}   [p]/[q]=wound   ESC=exit
# OW-4 live (experiments/openworld/ow4-results.md). The
# bottom row is dealt a random scatter of six laws from the
# 96-rule F2 cube; the top row is uniform A-matter. Laws that
# match the matter under them ignite (red α spawner, green β
# repairer, cyan γ walker, blue ω = A>B.writeB); laws that
# need B-matter (yellow Ω = B>B.writeB, white ρ = B>A.writeB)
# start INERT — until an A-law manufactures B and wakes them:
# niche construction, live. Blue ω consumes the very A-matter
# that powers it (its mutation clock is its own substrate),
# and one lhs-flip away sits yellow Ω — the repairer of the
# B-world ω creates. Miscopy mutation flashes magenta. Every
# load deals a different soup. Watch which law inherits the
# ring — and which matter.
#help random soup each load | yellow wakes when B appears | p/q=wound
#threads 1
#timing T 50
#timing p 1100
#timing q 1900
