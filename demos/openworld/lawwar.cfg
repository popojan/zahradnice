# OW-2 live (experiments/openworld/ow2-results.md). Top row:
# matter (A/B on a ring). Bottom row: the LAW at each place —
# green β = the night-2 repair archetype (walker + wound
# handler), cyan γ = the same walker WITHOUT the handler: a
# law that spreads but cannot heal. The rule table is frozen;
# what a locus may do is decided by the glyph below it, and
# every write of matter also stamps the writer's law onto the
# written cell — expansion carries law, so the two laws fight
# a two-way frontier war for the bottom row. Wounds strike
# both rows ambiently. Watch β heal its territory while γ's
# territory rots; watch the mixed phase drag on (near-1:1
# invasion) — every locus under γ is repair-dead load, and if
# the war lasts too long the whole world dies. Mash p/q to
# help it along.
#help top=matter bottom=law | green heals, cyan can't | p/q=wound
