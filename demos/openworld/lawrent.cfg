# OW-6 live (experiments/openworld/ow6-results.md). Three
# tracks now: matter on top, FUEL in the row beneath it
# (yellow o = a token, dark . = an empty slot), law at the
# bottom. Every act of expansion must consume the token
# under it — writing matter costs fuel; conversion is free.
# Tokens rain in ambiently (press f to feed by hand). Red α,
# the blind spawner, spends every token the moment it lands
# anywhere in its territory; green β, the walker-repairer,
# can only spend the token under its head — its land BANKS
# fuel, and a wound unlocks the local savings exactly where
# repair needs them. The OW-6 result to watch: the vault is
# lootable. When α's frontier takes a β cell it takes the
# token under it too; wealth flows to whoever can spend it
# fastest. Starve the world (never press f) and everything
# freezes, then rots: unpaid repair is no repair.
#help top=matter, middle=fuel, bottom=law | f=feed p/q=wound
